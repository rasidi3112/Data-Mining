[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dmtoolkit"
version = "0.1.0"
description = "Utilitas data mining untuk materi belajar bertahap: Apriori, evaluasi berbasis biaya, kalibrasi, drift monitoring, dan experiment tracking."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "rasidi3112" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "nbclient>=0.7", "nbformat>=5.7", "ipykernel>=6.0"]

[tool.setuptools]
packages = ["dmtoolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
